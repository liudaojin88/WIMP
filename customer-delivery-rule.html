    <!-- 新增/编辑记录弹窗 -->

                    <form class="row g-3">

                            <label class="form-label">规则类型</label>
                            <select class="form-select form-select-sm" id="formRuleType">

    <!-- 修改日志弹窗 -->
    <div class="modal fade" id="logModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">修改日志</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-sm align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 10%;">修改类型</th>
                                <th style="width: 30%;">修改前信息</th>
                                <th style="width: 30%;">修改后信息</th>
                                <th style="width: 15%;">修改人</th>
                                <th style="width: 15%;">修改时间</th>
                            </tr>
                        </thead>
                        <tbody id="logBody">
                            <tr><td colspan="5" class="text-center text-muted">暂无日志</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const weekOptions = ['周一','周二','周三','周四','周五','周六','周天'];
        let dataSource = [
            {
                id: 1,
                ruleType: '客户维度',
                customer: '测试客户A',
                weeks: ['周一','周三','周五'],
                workday: '否',
                createdBy: 'admin',
                createdAt: '2026-03-01 10:00:00',
                updatedBy: 'admin',
                updatedAt: '2026-03-01 10:00:00',
                logs: [
                    {
                        type: '新增',
                        before: '-',
                        after: '规则类型：客户维度，客户：测试客户A，周维度可配送时间：周一、周三、周五，是否工作日配送：否',
                        user: 'admin',
                        time: '2026-03-01 10:00:00'
                    }
                ]
            }
        ];
        let filtered = [...dataSource];
        let currentEditId = null;
        const recordModal = new bootstrap.Modal(document.getElementById('recordModal'));
        const logModal = new bootstrap.Modal(document.getElementById('logModal'));

        // 渲染周选择
        function renderWeekCheckboxes(containerId, selected = []) {
            const box = document.getElementById(containerId);
            box.innerHTML = weekOptions.map((w, idx) => {
                const checked = selected.includes(w) ? 'checked' : '';
                return `
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="week-${idx}" value="${w}" ${checked}>
                        <label class="form-check-label" for="week-${idx}">${w}</label>
                    </div>
                `;
            }).join('');
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            if (!filtered.length) {
                tbody.innerHTML = '<tr><td colspan="9" class="table-empty">暂无数据</td></tr>';
                return;
            }
            tbody.innerHTML = filtered.map((item, idx) => `
                <tr>
                    <td>${item.ruleType}</td>
                    <td>${item.customer}</td>
                    <td>${item.weeks.join('、')}</td>
                    <td>${item.workday}</td>
                    <td>${item.createdBy}</td>
                    <td>${item.createdAt}</td>
                    <td>${item.updatedBy}</td>
                    <td>${item.updatedAt}</td>
                    <td class="text-primary">
                        <a href="javascript:void(0)" data-idx="${idx}" class="link-edit">编辑</a>
                        <a href="javascript:void(0)" data-idx="${idx}" class="link-delete ms-2">删除</a>
                        <a href="javascript:void(0)" data-idx="${idx}" class="link-log ms-2">修改日志</a>
                    </td>
                </tr>
            `).join('');

            tbody.querySelectorAll('.link-edit').forEach(el => el.addEventListener('click', onEdit));
            tbody.querySelectorAll('.link-delete').forEach(el => el.addEventListener('click', onDelete));
            tbody.querySelectorAll('.link-log').forEach(el => el.addEventListener('click', onLog));
        }

        function openCreate() {
            currentEditId = null;
            document.getElementById('recordModalTitle').textContent = '新增记录';
            document.getElementById('formRuleType').value = '客户维度';
            document.getElementById('formCustomer').value = '';
            document.getElementById('formWorkday').value = '否';
            renderWeekCheckboxes('formWeeks', []);
            recordModal.show();
        }

        function onEdit(e) {
            const idx = Number(e.currentTarget.dataset.idx);
            const item = filtered[idx];
            if (!item) return;
            currentEditId = item.id;
            document.getElementById('recordModalTitle').textContent = '编辑记录';
            document.getElementById('formRuleType').value = item.ruleType;
            document.getElementById('formCustomer').value = item.customer;
            document.getElementById('formWorkday').value = item.workday;
            renderWeekCheckboxes('formWeeks', item.weeks || []);
            recordModal.show();
        }

        function onDelete(e) {
            const idx = Number(e.currentTarget.dataset.idx);
            const item = filtered[idx];
            if (!item) return;
            if (!confirm('确认删除该记录？')) return;
            dataSource = dataSource.filter(r => r.id !== item.id);
            filtered = filtered.filter((_, i) => i !== idx);
            renderTable();
        }

        function onLog(e) {
            const idx = Number(e.currentTarget.dataset.idx);
            const item = filtered[idx];
            const logBody = document.getElementById('logBody');
            if (!item || !item.logs || !item.logs.length) {
                logBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">暂无日志</td></tr>';
            } else {
                logBody.innerHTML = item.logs.map(l => `
                    <tr>
                        <td>${l.type}</td>
                        <td class="text-wrap">${l.before}</td>
                        <td class="text-wrap">${l.after}</td>
                        <td>${l.user}</td>
                        <td>${l.time}</td>
                    </tr>
                `).join('');
            }
            logModal.show();
        }

        function getFormData() {
            const ruleType = document.getElementById('formRuleType').value.trim();
            const customer = document.getElementById('formCustomer').value.trim();
            const workday = document.getElementById('formWorkday').value;
            const weeks = Array.from(document.querySelectorAll('#formWeeks input:checked')).map(i => i.value);
            return { ruleType, customer, workday, weeks };
        }

        function validateForm(data) {
            if (!data.customer) { alert('请输入客户/客户PIN'); return false; }
            if (!data.weeks.length) { alert('请至少选择一个周配送时间'); return false; }
            const hasWeekend = data.weeks.includes('周六') || data.weeks.includes('周天');
            if (hasWeekend && data.workday === '是') {
                const ok = confirm('选择的日期已经是工作日，请确认是否继续！');
                if (!ok) return false;
            }
            return true;
        }

        function saveRecord() {
            const formData = getFormData();
            if (!validateForm(formData)) return;
            const now = new Date();
            const nowStr = now.toISOString().slice(0, 19).replace('T', ' ');
            if (currentEditId) {
                const idx = dataSource.findIndex(r => r.id === currentEditId);
                if (idx > -1) {
                    const before = dataSource[idx];
                    dataSource[idx] = {
                        ...before,
                        ...formData,
                        updatedBy: 'admin',
                        updatedAt: nowStr,
                        logs: [
                            ...(before.logs || []),
                            {
                                type: '修改',
                                before: `规则类型：${before.ruleType}，客户：${before.customer}，周维度可配送时间：${before.weeks.join('、')}，是否工作日配送：${before.workday}`,
                                after: `规则类型：${formData.ruleType}，客户：${formData.customer}，周维度可配送时间：${formData.weeks.join('、')}，是否工作日配送：${formData.workday}`,
                                user: 'admin',
                                time: nowStr
                            }
                        ]
                    };
                }
            } else {
                const newId = Date.now();
                dataSource.unshift({
                    id: newId,
                    ...formData,
                    createdBy: 'admin',
                    createdAt: nowStr,
                    updatedBy: 'admin',
                    updatedAt: nowStr,
                    logs: [
                        {
                            type: '新增',
                            before: '-',
                            after: `规则类型：${formData.ruleType}，客户：${formData.customer}，周维度可配送时间：${formData.weeks.join('、')}，是否工作日配送：${formData.workday}`,
                            user: 'admin',
                            time: nowStr
                        }
                    ]
                });
            }
            filtered = [...dataSource];
            renderTable();
            recordModal.hide();
        }

        function applyFilter() {
            const ruleType = document.getElementById('filterRuleType').value;
            const customer = document.getElementById('filterCustomer').value.trim();
            const week = document.getElementById('filterWeek').value;
            const workday = document.getElementById('filterWorkday').value;
            filtered = dataSource.filter(item => {
                if (ruleType !== '全部' && item.ruleType !== ruleType) return false;
                if (customer && !item.customer.includes(customer)) return false;
                if (week !== '全部' && !(item.weeks || []).includes(week)) return false;
                if (workday !== '全部' && item.workday !== workday) return false;
                return true;
            });
            renderTable();
        }

        function resetFilter() {
            document.getElementById('filterRuleType').value = '全部';
            document.getElementById('filterCustomer').value = '';
            document.getElementById('filterWeek').value = '全部';
            document.getElementById('filterWorkday').value = '全部';
            filtered = [...dataSource];
            renderTable();
        }

        function bindEvents() {
            document.querySelectorAll('.btn.btn-primary.btn-sm').forEach(btn => {
                if (btn.textContent.includes('新增记录')) {
                    btn.addEventListener('click', openCreate);
                }
            });
            document.getElementById('saveRecordBtn').addEventListener('click', saveRecord);
            const resetBtn = document.querySelector('.card-block button.btn-outline-secondary');
            const searchBtn = document.querySelector('.card-block button.btn-primary');
            if (resetBtn) resetBtn.addEventListener('click', resetFilter);
            if (searchBtn) searchBtn.addEventListener('click', applyFilter);
        }

        function init() {
            renderWeekCheckboxes('formWeeks', []);
            renderTable();
            bindEvents();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
