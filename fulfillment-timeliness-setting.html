<body>

    <div class="container-fluid">

            <div class="col-12 col-md-2 col-lg-2 sidebar">

                <a href="dashboard.html" class="nav-link">
                    <i class="bi bi-house-door"></i><span>系统首页</span>

                <div class="nav-group-title mt-3">履约管理</div>

                <a href="fulfillment-product-binding.html" class="nav-link">

            <div class="col-12 col-md-10 col-lg-10 p-0">
                <div class="page-header">
                    <h1 class="page-title">时效设置</h1>
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-primary btn-sm">
                            <i class="bi bi-plus-lg me-1"></i>新增
                        </button>
                    </div>
                </div>

                <div class="content-wrapper">
                    <div class="filter-card">
                        <form class="row g-3 align-items-end">
                            <div class="col-md-3">
                                <label class="form-label">履约模式</label>
                                <select class="form-select" id="filterMode">
                                    <option value="">请选择</option>
                                    <option value="跨境直发">跨境直发</option>
                                    <option value="备货发货">备货发货</option>
                                    <option value="本土直发">本土直发</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">适用国家/地区</label>
                                <select class="form-select" id="filterCountry">
                                    <option value="">请选择</option>
                                    <option value="中国">中国</option>
                                    <option value="泰国">泰国</option>
                                    <option value="中国香港">中国香港</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">最后修改时间（开始）</label>
                                <input type="date" class="form-control" id="filterStartDate">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">最后修改时间（结束）</label>
                                <input type="date" class="form-control" id="filterEndDate">
                            </div>
                            <div class="col-12 d-flex justify-content-end gap-2">
                                <button type="button" class="btn btn-outline-secondary btn-sm" id="resetBtn">重置</button>
                                <button type="button" class="btn btn-primary btn-sm" id="searchBtn">查询</button>
                            </div>
                        </form>
                    </div>

                    <div class="table-card">
                        <table class="table mb-0">
                            <thead>
                                <tr>
                                    <th style="width: 12%;">履约模式</th>
                                    <th style="width: 22%;">适用国家/地区地址</th>
                                    <th style="width: 16%;">对客时效(d)</th>
                                    <th style="width: 14%;">最后修改人</th>
                                    <th style="width: 18%;">最后修改时间</th>
                                    <th style="width: 12%;">操作</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr>
                                    <td colspan="9" class="table-empty">暂无数据</td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="pagination-wrapper">
                            <div class="text-muted small" id="paginationInfo">共 0 条</div>
                            <nav>
                                <ul class="pagination pagination-sm mb-0" id="pagination">
                                    <li class="page-item disabled"><span class="page-link">上一页</span></li>
                                    <li class="page-item active"><span class="page-link">1</span></li>
                                    <li class="page-item disabled"><span class="page-link">下一页</span></li>
                                </ul>

                        </div>

            </div>

    <!-- 适用地址弹窗 -->
    <div class="modal fade" id="addressModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">适用地址</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-sm align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 25%;">国家/地区</th>
                                <th>四级地址</th>
                            </tr>
                        </thead>
                        <tbody id="addressBody">
                            <tr><td colspan="2" class="text-center text-muted">暂无地址</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 前端数据占位（含示例数据）
        const dataSource = [
            {
                id: 1,
                mode: '跨境直发',
                country: '中国',
                addresses: [
                    { province: '广东省', city: '广州', district: '天河区' },
                    { province: '浙江省', city: '杭州', district: '西湖区' }
                ],
                timeliness: '64-100',
                updatedBy: 'xuxicheng3',
                updatedAt: '2026-01-26 14:49:50'
            },
            {
                id: 2,
                mode: '备货发货',
                country: '泰国',
                addresses: [
                    { province: '曼谷府', city: '曼谷', district: '曼谷一区' }
                ],
                timeliness: '1-4',
                updatedBy: 'wangyuan37',
                updatedAt: '2026-01-19 15:17:34'
            },
            {
                id: 3,
                mode: '本土直发',
                country: '中国香港',
                addresses: [
                    { province: '中国香港', city: '中西区', district: '中环' }
                ],
                timeliness: '5-7',
                updatedBy: 'gaowei167',
                updatedAt: '2025-12-18 18:28:50'
            }
        ];
        let filtered = [];
        const pagination = { pageSize: 10, current: 1 };
        const addressModal = typeof bootstrap !== 'undefined' ? new bootstrap.Modal(document.getElementById('addressModal')) : null;

        function handleEdit(event) {
            const idx = Number(event.currentTarget.dataset.idx);
            const item = filtered[idx];
            if (!item) return;
            try {
                localStorage.setItem('timelinessEditRecord', JSON.stringify({
                    countries: item.countries || [item.country],
                    mode: item.mode,
                    stages: item.stages || []
                }));
            } catch (e) {}
            window.location.href = 'fulfillment-timeliness-edit.html';
        }

        function showAddress(event) {
            const idx = Number(event.currentTarget.dataset.idx);
            const item = filtered[idx];
            const body = document.getElementById('addressBody');
            if (!item || !item.addresses || !item.addresses.length) {
                body.innerHTML = '<tr><td colspan="2" class="text-center text-muted">暂无地址</td></tr>';
            } else {
                body.innerHTML = item.addresses.map(a => `
                    <tr>
                        <td>${item.country || ''}</td>
                        <td>${[a.province,a.city,a.district].filter(Boolean).join(' - ')}</td>
                    </tr>
                `).join('');
            }
            addressModal && addressModal.show();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            if (!filtered.length) {
                tbody.innerHTML = '<tr><td colspan="9" class="table-empty">暂无数据</td></tr>';
                document.getElementById('paginationInfo').textContent = '共 0 条';
                document.getElementById('pagination').innerHTML = `
                    <li class="page-item disabled"><span class="page-link">上一页</span></li>
                    <li class="page-item active"><span class="page-link">1</span></li>
                    <li class="page-item disabled"><span class="page-link">下一页</span></li>
                `;
                return;
            }
            tbody.innerHTML = filtered.map((item, idx) => `
                <tr>
                    <td>${item.mode || ''}</td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <span>${item.country || ''}</span>
                            ${item.addresses && item.addresses.length ? `<button class="btn btn-link btn-sm p-0" data-idx="${idx}" onclick="showAddress(event)">适用地址</button>` : ''}
                        </div>
                    </td>
                    <td>${item.timeliness || ''}</td>
                    <td>${item.updatedBy || ''}</td>
                    <td>${item.updatedAt || ''}</td>
                    <td class="actions text-primary">
                        <a href="javascript:void(0)" data-idx="${idx}" onclick="handleEdit(event)">编辑</a>
                        <a>复制新增</a>
                        <a>删除</a>
                        <a>查看</a>
                    </td>
                </tr>
            `).join('');
            document.getElementById('paginationInfo').textContent = `共 ${filtered.length} 条`;
            document.getElementById('pagination').innerHTML = `
                <li class="page-item disabled"><span class="page-link">上一页</span></li>
                <li class="page-item active"><span class="page-link">1</span></li>
                <li class="page-item disabled"><span class="page-link">下一页</span></li>
            `;
        }

        function applyFilter() {
            const mode = document.getElementById('filterMode').value.trim();
            const country = document.getElementById('filterCountry').value.trim();
            const province = document.getElementById('filterProvince').value.trim();
            const city = document.getElementById('filterCity').value.trim();
            const district = document.getElementById('filterDistrict').value.trim();
            const start = document.getElementById('filterStartDate').value;
            const end = document.getElementById('filterEndDate').value;
            filtered = dataSource.filter(item => {
                if (mode && item.mode !== mode) return false;
                if (country && item.country !== country) return false;
                if (province && item.province !== province) return false;
                if (city && item.city !== city) return false;
                if (district && item.district !== district) return false;
                if (start && item.updatedAt.slice(0,10) < start) return false;
                if (end && item.updatedAt.slice(0,10) > end) return false;
                return true;
            });
            renderTable();
        }

        function resetFilter() {
            document.getElementById('filterMode').value = '';
            document.getElementById('filterCountry').value = '';
            document.getElementById('filterProvince').value = '';
            document.getElementById('filterCity').value = '';
            document.getElementById('filterDistrict').value = '';
            document.getElementById('filterStartDate').value = '';
            document.getElementById('filterEndDate').value = '';
            filtered = [...dataSource];
            renderTable();
        }

        function init() {
            filtered = [...dataSource];
            renderTable();
            document.getElementById('searchBtn').addEventListener('click', applyFilter);
            document.getElementById('resetBtn').addEventListener('click', resetFilter);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
