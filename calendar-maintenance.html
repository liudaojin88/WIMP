                            </div>
                            <div class="col-12 d-flex justify-content-end gap-2">

                                </button>
                            </div>
                        </div>
                        <table class="table mb-0">
                            <thead>
                                <tr>
                                    <th style="width: 16%;">日期</th>
                                    <th style="width: 14%;">是否工作日</th>
                                    <th style="width: 20%;">适用国家</th>
                                    <th style="width: 14%;">创建人</th>
                                    <th style="width: 20%;">创建时间</th>
                                    <th style="width: 16%;">操作</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr>
                                    <td colspan="6" class="table-empty">暂无数据</td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="d-flex justify-content-between align-items-center px-3 py-2">

                            <ul class="pagination pagination-sm mb-0">
                                <li class="page-item disabled"><span class="page-link">上一页</span></li>
                                <li class="page-item active"><span class="page-link">1</span></li>
                                <li class="page-item disabled"><span class="page-link">下一页</span></li>
                            </ul>

    <!-- 新增记录弹窗 -->
    <div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">新增记录</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <form class="row g-3">
                        <div class="col-12">
                            <label class="form-label">日期</label>
                            <input type="date" class="form-control form-control-sm" id="formDate">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">是否工作日</label>
                            <select class="form-select form-select-sm" id="formWorkday">
                                <option value="是">是</option>
                                <option value="否" selected>否</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">适用国家</label>
                            <select class="form-select form-select-sm" id="formCountry">
                                <option value="">请选择</option>
                                <option value="中国-CN">中国-CN</option>
                                <option value="泰国-TH">泰国-TH</option>
                                <option value="越南-VN">越南-VN</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                    <button class="btn btn-primary btn-sm" id="saveBtn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const dataSource = [
            {
                id: 1,
                date: '2026-05-01',
                isWorkday: '否',
                country: '中国-CN',
                createdBy: 'admin',
                createdAt: '2026-03-01 10:00:00'
            }
        ];
        let filtered = [];
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            if (!filtered.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="table-empty">暂无数据</td></tr>';
                document.getElementById('paginationInfo').textContent = '共 0 条';
                return;
            }
            tbody.innerHTML = filtered.map((item, idx) => `
                <tr>
                    <td>${item.date}</td>
                    <td>${item.isWorkday}</td>
                    <td>${item.country}</td>
                    <td>${item.createdBy}</td>
                    <td>${item.createdAt}</td>
                    <td class="text-primary">
                        <a href="javascript:void(0)" data-idx="${idx}" class="link-delete">删除</a>
                    </td>
                </tr>
            `).join('');
            document.getElementById('paginationInfo').textContent = `共 ${filtered.length} 条`;
            tbody.querySelectorAll('.link-delete').forEach(el => el.addEventListener('click', onDelete));
        }
        function applyFilter() {
            const date = document.getElementById('filterDate').value;
            const workday = document.getElementById('filterWorkday').value;
            const country = document.getElementById('filterCountry').value;
            filtered = dataSource.filter(item => {
                if (date && item.date !== date) return false;
                if (workday !== '全部' && item.isWorkday !== workday) return false;
                if (country !== '全部' && item.country !== country) return false;
                return true;
            });
            renderTable();
        }
        function resetFilter() {
            document.getElementById('filterDate').value = '';
            document.getElementById('filterWorkday').value = '全部';
            document.getElementById('filterCountry').value = '全部';
            filtered = [...dataSource];
            renderTable();
        }
        function onDelete(e) {
            const idx = Number(e.currentTarget.dataset.idx);
            const item = filtered[idx];
            if (!item) return;
            if (!confirm('确认删除该记录？')) return;
            const originIdx = dataSource.findIndex(r => r.id === item.id);
            if (originIdx > -1) dataSource.splice(originIdx, 1);
            filtered.splice(idx, 1);
            renderTable();
        }
        function getFormData() {
            return {
                date: document.getElementById('formDate').value,
                isWorkday: document.getElementById('formWorkday').value,
                country: document.getElementById('formCountry').value
            };
        }
        function validateForm(data) {
            if (!data.date) { alert('请选择日期'); return false; }
            if (!data.country) { alert('请选择适用国家'); return false; }
            const weekday = new Date(data.date).getDay(); // 0 周日 6 周六
            const isWeekend = (weekday === 0 || weekday === 6);
            if (isWeekend && data.isWorkday === '是') {
                const ok = confirm('选择的日期已经是工作日，请确认是否继续！');
                if (!ok) return false;
            }
            return true;
        }
        function saveRecord() {
            const data = getFormData();
            if (!validateForm(data)) return;
            const now = new Date().toISOString().slice(0,19).replace('T',' ');
            dataSource.unshift({
                id: Date.now(),
                date: data.date,
                isWorkday: data.isWorkday,
                country: data.country,
                createdBy: 'admin',
                createdAt: now
            });
            filtered = [...dataSource];
            renderTable();
            const modal = bootstrap.Modal.getInstance(document.getElementById('addModal'));
            modal.hide();
        }
        function bindEvents() {
            document.getElementById('searchBtn').addEventListener('click', applyFilter);
            document.getElementById('resetBtn').addEventListener('click', resetFilter);
            document.getElementById('saveBtn').addEventListener('click', saveRecord);
        }
        function init() {
            filtered = [...dataSource];
            renderTable();
            bindEvents();
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
