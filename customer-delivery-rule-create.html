<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建客户配送规则 - 履约管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Microsoft YaHei', Arial, sans-serif; }
        .container-card { max-width: 960px; margin: 24px auto; }
        .card { box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .required::before { content: '*'; color: #dc3545; margin-right: 4px; }
    </style>
</head>
<body>
    <div class="container-card">
        <div class="card">
            <div class="card-header d-flex align-items-center justify-content-between">
                <h5 class="mb-0">新建客户配送规则</h5>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary btn-sm" id="btnCancel">取消</button>
                    <button class="btn btn-primary btn-sm" id="btnSave">保存</button>
                </div>
            </div>
            <div class="card-body">
                <form class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label required">规则类型</label>
                        <select class="form-select form-select-sm" id="ruleType">
                            <option value="客户维度">客户维度</option>
                            <option value="客户PIN">客户PIN</option>
                        </select>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label required">客户/客户PIN</label>
                        <input type="text" class="form-control form-control-sm" id="customerInput" placeholder="输入客户名称或PIN">
                    </div>
                    <div class="col-12">
                        <label class="form-label required">周维度可配送时间</label>
                        <div id="weekGroup" class="d-flex flex-wrap gap-3"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label required">仅工作日配送</label>
                        <select class="form-select form-select-sm" id="workdaySelect">
                            <option value="否" selected>否</option>
                            <option value="是">是</option>
                        </select>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const weekOptions = ['周一','周二','周三','周四','周五','周六','周天'];

        function renderWeekOptions(selected = []) {
            const box = document.getElementById('weekGroup');
            box.innerHTML = weekOptions.map((w, idx) => {
                const checked = selected.includes(w) ? 'checked' : '';
                return `
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="week-${idx}" value="${w}" ${checked}>
                        <label class="form-check-label" for="week-${idx}">${w}</label>
                    </div>
                `;
            }).join('');
        }

        function getFormData() {
            const ruleType = document.getElementById('ruleType').value.trim();
            const customer = document.getElementById('customerInput').value.trim();
            const workday = document.getElementById('workdaySelect').value;
            const weeks = Array.from(document.querySelectorAll('#weekGroup input:checked')).map(i => i.value);
            return { ruleType, customer, workday, weeks };
        }

        function validateForm(data) {
            if (!data.customer) { alert('请输入客户/客户PIN'); return false; }
            if (!data.weeks.length) { alert('请至少选择一个周配送时间'); return false; }
            const hasWeekend = data.weeks.includes('周六') || data.weeks.includes('周天');
            if (hasWeekend && data.workday === '是') {
                const ok = confirm('选择的日期已经是工作日，请确认是否继续！');
                if (!ok) return false;
            }
            return true;
        }

        function save() {
            const data = getFormData();
            if (!validateForm(data)) return;
            alert('保存成功（前端占位，无后端提交）');
            // 可根据需要回跳列表
        }

        function bindEvents() {
            document.getElementById('btnSave').addEventListener('click', save);
            document.getElementById('btnCancel').addEventListener('click', () => history.back());
        }

        function init() {
            renderWeekOptions([]);
            bindEvents();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
